[project]
name = "pdf-tool"
version = "0.1.0"
description = "Universal document conversion CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "pdf-tool contributors" }
]
keywords = [
    "pdf",
    "converter",
    "cli",
    "ocr",
    "document-converter",
    "docx",
    "markdown",
    "weasyprint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Office/Business",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "pymupdf>=1.23.0",
    "pypdf>=4.0.0",
    "python-magic>=0.4.27",
    "tomli-w>=1.0.0",
    "weasyprint>=70.0",
    "pygments>=2.21.0",
    "markdown-it-py>=4.2.0",
    "pdf2docx>=0.5.13",
    "pdfplumber>=0.11.10",
    "ocrmypdf>=17.13.0",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/example/pdf-tool"
Documentation = "https://github.com/example/pdf-tool#readme"
Repository = "https://github.com/example/pdf-tool"
Issues = "https://github.com/example/pdf-tool/issues"

[project.scripts]
pdf = "pdf_tool.main:app"
pdf-tool = "pdf_tool.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_tool"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
